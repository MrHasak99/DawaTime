name: dawatime
description: A medication reminder app.
publish_to: "none"
version: 1.4.4+28

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  flutter_launcher_icons: ^0.14.4
  permission_handler: ^12.0.0+1
  android_intent_plus: ^5.3.0
  package_info_plus: ^8.3.0
  flutter_timezone: ^4.1.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.4.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  firebase_performance: ^0.11.0
  workmanager: ^0.9.0+2
  flutter_native_splash: ^2.4.6
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_gen: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/DawaTime.png"
  remove_alpha_ios: true
flutter_native_splash:
  color: "#8AC249"
  image: assets/DawaTime.png
  ios: true
