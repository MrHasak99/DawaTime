<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DawaTime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="DawaTime.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="DawaTime.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="DawaTime.png" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("Inter_18pt-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Nunito";
        src: url("Nunito-ExtraBold.ttf") format("truetype");
        font-weight: bold;
        font-style: normal;
      }
      body {
        background: #f7fafc;
        color: #222;
        font-family: "Nunito", "Inter", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .logo {
        width: 307px;
        height: 294px;
        margin-bottom: 2rem;
      }
      h1 {
        font-family: "Nunito", Arial, sans-serif;
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      p {
        font-family: "Inter", Arial, sans-serif;
        font-size: 1.2rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <img src="DawaTime.png" class="logo" style="margin-bottom: 1rem" />
    <h1 style="color: #8ac249; margin-top: 0">DawaTime</h1>
    <h2>Available Now on the Apple App Store 🍎</h2>
    <h3>Coming Soon to Android 🤖</h3>
    <div style="margin-top: 2rem; display: flex; gap: 1rem">
      <a
        href="https://apps.apple.com/app/dawatime/id6748280994"
        target="_blank"
        style="text-decoration: none"
      >
        <img
          src="black.svg"
          alt="Download on the App Store"
          style="height: 48px"
        />
      </a>
      <button
        style="
          background: #8ac249;
          color: #fff;
          border: none;
          border-radius: 8px;
          padding: 0.75rem 1.5rem;
          font-size: 1rem;
          font-family: 'Nunito', Arial, sans-serif;
          cursor: pointer;
        "
      >
        Continue to Web App (Coming Soon)
      </button>
    </div>
  </body>
</html>
