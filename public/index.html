<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DawaTime - Never Miss a Dose | Medication Reminder App</title>
    <meta name="description" content="DawaTime helps you manage medication schedules with smart reminders and refill alerts. Available on iOS and Android. Never miss a dose again!" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://dawatime.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="DawaTime-favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="DawaTime-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="DawaTime-favicon.png" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("Inter_18pt-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Nunito";
        src: url("Nunito-ExtraBold.ttf") format("truetype");
        font-weight: bold;
        font-style: normal;
      }
      @import url("https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap");
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --text-secondary: #333333;
        --text-tertiary: #666666;
        --primary-color: #8ac249;
        --primary-hover: #7bb13b;
        --card-bg: #f5f5f5;
        --card-border: rgba(138, 194, 73, 0.2);
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
      }
      [data-theme="dark"] {
        --bg-color: #000000;
        --text-color: #ffffff;
        --text-secondary: #e0e0e0;
        --text-tertiary: #cccccc;
        --primary-color: #8ac249;
        --primary-hover: #9dd954;
        --card-bg: #1a1a1a;
        --card-border: rgba(138, 194, 73, 0.3);
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }
      body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Nunito", "Inter", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
        box-sizing: border-box;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .logo {
        width: 280px;
        height: 270px;
        margin: 0 auto 0.75rem auto;
        display: block;
        border-radius: 24px;
      }
      h1 {
        font-family: "Nunito", Arial, sans-serif;
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-align: center;
      }
      h2 {
        font-family: "Nunito", Arial, sans-serif;
        text-align: center;
        margin-bottom: 1rem;
      }
      p {
        font-family: "Inter", Arial, sans-serif;
        font-size: 1.2rem;
        color: var(--text-secondary);
      }
      @media (max-width: 768px) {
        body {
          padding: 1.5rem 1rem;
          padding-bottom: 6rem;
        }
        h1 {
          font-size: 2rem;
        }
        h2 {
          font-size: 1.3rem;
        }
      }
      @media (max-width: 480px) {
        body {
          padding: 1rem 0.75rem;
          padding-bottom: 5.5rem;
        }
        h1 {
          font-size: 1.8rem;
        }
        h2 {
          font-size: 1.1rem;
        }
      }
    </style>
    <link rel="stylesheet" href="shared-toggles.css?v=2">
    <script src="shared-toggles.js?v=2"></script>
  </head>
  <body>
    <img src="DawaTime.png" class="logo" alt="DawaTime Logo" />
    <h1
      style="color: var(--primary-color); margin-top: 0; margin-bottom: 0.25rem"
      data-translate="app-title"
    >
      DawaTime
    </h1>
    <h2 data-translate="subtitle">Available Now on iOS & Android</h2>
    <p
      style="text-align: center; margin-bottom: 0.5rem"
      data-translate="description"
    >
      Download from the App Store or Google Play, or use our web app
    </p>
    <div
      style="
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      "
    >
      <a
        href="https://apps.apple.com/app/dawatime/id6748280994"
        target="_blank"
        style="
          text-decoration: none;
          display: inline-block;
          transition: all 0.3s ease;
        "
        onmouseover="this.style.transform='translateY(-2px)'; this.style.filter='drop-shadow(0 4px 12px rgba(0,0,0,0.15))';"
        onmouseout="this.style.transform='translateY(0)'; this.style.filter='none';"
      >
        <img
          id="app-store-badge"
          src="enblack.svg"
          alt="Download on the App Store"
          data-translate-alt="app-store-alt"
          style="height: 48px; border-radius: 8px"
        />
      </a>
      <a
        href="https://play.google.com/store/apps/details?id=com.mrhasak99.dawatime"
        target="_blank"
        style="
          text-decoration: none;
          display: inline-block;
          transition: all 0.3s ease;
        "
        onmouseover="this.style.transform='translateY(-2px)'; this.style.filter='drop-shadow(0 4px 12px rgba(0,0,0,0.15))';"
        onmouseout="this.style.transform='translateY(0)'; this.style.filter='none';"
      >
        <img
          id="play-store-badge"
          src="GetItOnGooglePlay_Badge_Web_color_English.svg"
          alt="Get it on Google Play"
          data-translate-alt="play-store-alt"
          style="height: 48px; border-radius: 8px"
        />
      </a>
      <a
        href="https://webapp.dawatime.com"
        target="_blank"
        style="text-decoration: none"
      >
        <button
          style="
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-family: 'Nunito', Arial, sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='var(--primary-hover)'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(138, 194, 73, 0.3)';"
          onmouseout="this.style.background='var(--primary-color)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';"
        >
          <span data-translate="web-app">Continue to Web App</span>
        </button>
      </a>
    </div>
    <div style="text-align: center; margin: 1.5rem 0">
      <a
        href="support"
        style="
          color: var(--primary-color);
          text-decoration: none;
          font-weight: 600;
          padding: 0.5rem 1rem;
          border: 2px solid var(--primary-color);
          border-radius: 8px;
          display: inline-block;
          transition: all 0.3s ease;
          font-family: 'Nunito', Arial, sans-serif;
        "
        onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(138, 194, 73, 0.3)';"
        onmouseout="this.style.background='transparent'; this.style.color='var(--primary-color)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';"
      >
        <span data-translate="support-link"
          >Need Help? Visit Support Center</span
        >
      </a>
    </div>
    <script>
      window.translations = {
        en: {
          "app-title": "DawaTime",
          subtitle: "Available Now on iOS & Android",
          description:
            "Download from the App Store or Google Play, or use our web app",
          "app-store-alt": "Download on the App Store",
          "play-store-alt": "Get it on Google Play",
          "web-app": "Continue to Web App",
          "support-link": "Need Help? Please visit Support Center",
        },
        ar: {
          "app-title": "دواء تايم",
          subtitle: "متوفر الآن على iOS و Android",
          description:
            "حمّل من آب ستور أو جوجل بلاي، أو استخدم تطبيق الويب",
          "app-store-alt": "حمّل من آب ستور",
          "play-store-alt": "حمّله من جوجل بلاي",
          "web-app": "استمر لتطبيق الويب",
          "support-link": "تحتاج مساعدة؟ تفضل بزيارة مركز الدعم",
        },
      };

      function updateStoreBadges() {
        const appStoreBadge = document.getElementById('app-store-badge');
        const playStoreBadge = document.getElementById('play-store-badge');
        const currentLang = document.documentElement.getAttribute('lang');
        
        if (appStoreBadge) {
          appStoreBadge.src = currentLang === 'ar' ? 'arblack.svg' : 'enblack.svg';
        }
        
        if (playStoreBadge) {
          playStoreBadge.src = currentLang === 'ar' 
            ? 'GetItOnGooglePlay_Badge_Web_color_Arabic-Saudi-Arabia.svg' 
            : 'GetItOnGooglePlay_Badge_Web_color_English.svg';
        }
      }

      updateStoreBadges();

      const observer = new MutationObserver(updateStoreBadges);
      observer.observe(document.documentElement, { 
        attributes: true, 
        attributeFilter: ['lang'] 
      });
    </script>
  </body>
</html>
