<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DawaTime Support - Get Help & Contact Us</title>
    <meta name="description" content="Need help with DawaTime? Contact our support team for assistance with medication reminders, account issues, and app features." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://dawatime.hamadalkhalaf.com/support" />
    <link rel="icon" type="image/png" sizes="32x32" href="DawaTime.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="DawaTime.png" />
    <link rel="apple-touch-icon" sizes="180x80" href="DawaTime.png" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("Inter_18pt-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito";
        src: url("Nunito-ExtraBold.ttf") format("truetype");
        font-weight: bold;
        font-style: normal;
      }
      @import url("https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap");
      :root {
        --bg-color: #ffffff;
        --container-bg: #f5f5f5;
        --card-bg: #f5f5f5;
        --card-border: rgba(138, 194, 73, 0.2);
        --text-color: #000000;
        --secondary-text-color: #333333;
        --muted-text-color: #666666;
        --primary-color: #8ac249;
        --primary-hover: #7bb13b;
        --link-color: #388e3c;
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
      }
      [data-theme="dark"] {
        --bg-color: #000000;
        --container-bg: #1a1a1a;
        --card-bg: #1a1a1a;
        --card-border: rgba(138, 194, 73, 0.3);
        --text-color: #ffffff;
        --secondary-text-color: #e0e0e0;
        --muted-text-color: #b0b0b0;
        --primary-color: #8ac249;
        --primary-hover: #9dd954;
        --link-color: #8ac249;
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }
      html[dir="rtl"] {
        font-family: "Noto Kufi Arabic", "Nunito", "Inter", Arial, sans-serif;
      }
      html[dir="rtl"] .support-list {
        text-align: right;
      }
      body {
        font-family: "Nunito", "Inter", Arial, sans-serif;
        background: var(--bg-color);
        margin: 0;
        padding: 0;
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .container {
        max-width: 420px;
        margin: 48px auto;
        background: var(--container-bg);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 32px 24px 24px 24px;
        text-align: center;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }
      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 18px;
      }
      h1 {
        color: var(--primary-color);
        font-size: 2rem;
        margin-bottom: 8px;
        font-weight: 700;
        text-align: center;
        letter-spacing: 1px;
      }
      p {
        font-size: 1rem;
        margin-bottom: 24px;
        text-align: center;
        color: var(--secondary-text-color);
        transition: color 0.3s ease;
      }
      .support-list {
        text-align: left;
        margin: 0 auto 24px auto;
        max-width: 320px;
        padding-left: 0;
      }
      .support-list li {
        margin-bottom: 12px;
        font-size: 1rem;
      }
      a {
        color: var(--link-color);
        text-decoration: none;
        transition: color 0.3s ease;
      }
      a:hover {
        text-decoration: underline;
      }
      @media (max-width: 500px) {
        .container {
          padding: 18px 6px;
        }
        .logo {
          width: 60px;
          height: 60px;
        }
      }
    </style>
    <link rel="stylesheet" href="shared-toggles.css?v=2">
    <script src="shared-toggles.js?v=2"></script>
  </head>
  <body>
    <div class="container">
      <img src="DawaTime.png" class="logo" alt="DawaTime Logo" />
      <h1 data-en="Support" data-ar="الدعم">Support</h1>
      <p
        data-en="Need help with DawaTime? We're here for you!"
        data-ar="تحتاج مساعدة مع دواء تايم؟ نحن هنا لمساعدتك!"
      >
        Need help with DawaTime? We're here for you!
      </p>
      <ul class="support-list">
        <li>
          <b data-en="Email:" data-ar="البريد الإلكتروني:">Email:</b>
          <a href="mailto:dawatime.support@hamadalkhalaf.com">dawatime.support@hamadalkhalaf.com</a>
        </li>
        <li>
          <b data-en="Delete account:" data-ar="حذف الحساب:">Delete account:</b>
          <a
            href="account-deletion"
            data-en="Request account deletion"
            data-ar="طلب حذف الحساب"
            >Request account deletion</a
          >
        </li>
        <li>
          <b data-en="Privacy Policy:" data-ar="سياسة الخصوصية:"
            >Privacy Policy:</b
          >
          <a
            href="privacy-policy"
            target="_blank"
            data-en="View Online"
            data-ar="عرض على الإنترنت"
            >View Online</a
          >
          |
          <a
            href="PrivacyPolicy.pdf"
            target="_blank"
            data-en="PDF"
            data-ar="PDF"
            >PDF</a
          >
        </li>
        <li>
          <b data-en="Terms & Conditions:" data-ar="الشروط والأحكام:"
            >Terms &amp; Conditions:</b
          >
          <a
            href="terms-and-conditions"
            target="_blank"
            data-en="View Online"
            data-ar="عرض على الإنترنت"
            >View Online</a
          >
          |
          <a
            href="Terms&Conditions.pdf"
            target="_blank"
            data-en="PDF"
            data-ar="PDF"
            >PDF</a
          >
        </li>
      </ul>
      <p
        style="
          font-size: 0.95rem;
          color: var(--muted-text-color);
          transition: color 0.3s ease;
        "
        data-en="We aim to respond to all support requests within 1-2 business days."
        data-ar="نهدف للرد على جميع طلبات الدعم خلال يوم - يومين عمل."
      >
        We aim to respond to all support requests within 1-2 business days.
      </p>
    </div>

    <script>
    </script>
  </body>
</html>
